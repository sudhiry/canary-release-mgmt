# deploy/kind/istio/iop-config.yaml
# IstioOperator config: default profile + NodePort ingress gateway with stable nodePorts.
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: canary-release-mgmt
spec:
  profile: default
  components:
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          service:
            type: NodePort
            ports:
              - name: status-port
                port: 15021
                targetPort: 15021
                nodePort: 30021
              - name: http2
                port: 80
                targetPort: 8080
                nodePort: 30080
              - name: https
                port: 443
                targetPort: 8443
                nodePort: 30443
