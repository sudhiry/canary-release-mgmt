apiVersion: v1
kind: Service
metadata:
  name: restate-headless
  namespace: restate
spec:
  clusterIP: None
  selector:
    app: restate
  ports:
    - name: node
      port: 5122
      targetPort: 5122
---
apiVersion: v1
kind: Service
metadata:
  name: restate
  namespace: restate
spec:
  type: ClusterIP
  selector:
    app: restate
  ports:
    - name: ingress
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9070
      targetPort: 9070
---
# NodePort exposing the admin endpoint to the host (mapped to host port 9070 by kind config).
apiVersion: v1
kind: Service
metadata:
  name: restate-admin-nodeport
  namespace: restate
spec:
  type: NodePort
  selector:
    app: restate
  ports:
    - name: admin
      port: 9070
      targetPort: 9070
      nodePort: 30090
