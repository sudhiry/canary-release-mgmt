{{- if .Values.restate.registerEndpoint }}
apiVersion: batch/v1
kind: Job
metadata:
  name: register-restate-{{ .Values.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.serviceName }}
    component: restate-register
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: {{ .Values.serviceName }}
        component: restate-register
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              set -eu
              SVC="{{ .Values.serviceName }}.{{ .Release.Namespace }}.svc.cluster.local"
              RESTATE_PORT="{{ .Values.ports.restateHandler }}"
              ADMIN="{{ .Values.env.RESTATE_ADMIN_URL }}"
              BODY="{\"uri\":\"http://${SVC}:${RESTATE_PORT}\",\"force\":true}"
              # Retry the registration POST directly. Restate Admin does the
              # discovery dance internally (it knows the right Accept header
              # version for the SDK manifest endpoint). A 2xx means the service
              # is reachable AND discovery succeeded. We retry on any non-2xx,
              # including transient connection failures while the service is
              # still booting.
              echo "Registering ${SVC}:${RESTATE_PORT} with Restate Admin at ${ADMIN}"
              for i in $(seq 1 60); do
                if curl -fs --max-time 5 -o /tmp/resp -X POST "${ADMIN}/deployments" \
                     -H 'content-type: application/json' -d "${BODY}"; then
                  echo "Registered."
                  cat /tmp/resp
                  exit 0
                fi
                echo "attempt ${i}/60 failed; sleeping 2s..."
                sleep 2
              done
              echo "registration timed out after 120s" >&2
              exit 1
{{- end }}
