apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "service-chart.resourceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-chart.labels" . | nindent 4 }}
data:
{{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
