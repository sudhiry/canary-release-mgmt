# Canary overlay — applied IN ADDITION to a per-service values file by
# Plan 1.4's canary-ctl. Phase 3.b: canary now registers Restate handlers
# under variant-suffixed service names (CheckoutSagaCanary, etc.). Both
# stable and canary register independently with no "latest wins" race.
#   - canary pods DO consume Kafka (per-subset consumer group <svc>-canary)
#   - canary pods DO register Restate handlers (Phase 3.b — was disabled in 3.a)
#   - canary pods carry the version: canary label so Istio's DestinationRule
#     subset routing can target them (HTTP) and the per-subset K8s Service
#     `<svc>-canary` selects them (Restate dispatch)
#
# Plan 1.4 runs roughly:
#   helm upgrade --install <svc>-canary deploy/helm/service-chart \
#     -f deploy/helm/values/<svc>.yaml \
#     -f deploy/helm/values/canary-overlay.yaml \
#     --set image.tag=<canary-tag> -n services

version: canary
replicas: 1
env:
  KAFKA_CONSUMERS_ENABLED: "true"
  # RESTATE_REGISTER_HANDLERS removed; canary now registers handlers (Phase 3.b).
  # Default from values.yaml ("true") applies.
  # Canary-only readiness gating: kafkaConsumer indicator must report UP
  # (i.e. consumer joined + heartbeat fresh within
  # canary.kafka-heartbeat-stale-ms; default 15s). When canary's consumer
  # heartbeat thread freezes (SIGSTOP, panic, lost group membership),
  # readiness flips to 503 → kubelet drops the pod from EndpointSlice →
  # stable's pod-watch sees Ready=False → stable picks up the next
  # flagged event. Stable does NOT have this gating — see application.yml.
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,kafkaConsumer"
restate:
  registerEndpoint: true   # canary now runs the post-install registration Job (Phase 3.b)
