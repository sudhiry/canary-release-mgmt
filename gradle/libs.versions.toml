[versions]
springBoot = "4.0.4"
springDependencyManagement = "1.1.7"
kafka = "3.9.0"
restateSdk = "2.7.0"
vertx = "4.5.24"
junit = "6.0.3"
mockito = "5.14.2"
assertj = "3.26.3"
micrometerTracing = "1.5.0"
opentelemetry = "1.51.0"
opentelemetryInstrumentation = "2.16.0"

[libraries]
spring-boot-starter-web        = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test       = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-actuator   = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-autoconfigure      = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-kafka                   = { module = "org.springframework.kafka:spring-kafka" }
kafka-clients                  = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
restate-sdk-api                = { module = "dev.restate:sdk-api", version.ref = "restateSdk" }
restate-sdk-common             = { module = "dev.restate:sdk-common", version.ref = "restateSdk" }
restate-sdk-http-vertx         = { module = "dev.restate:sdk-http-vertx",     version.ref = "restateSdk" }
vertx-core                     = { module = "io.vertx:vertx-core",              version.ref = "vertx" }
junit-jupiter                  = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher        = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
mockito-core                   = { module = "org.mockito:mockito-core", version.ref = "mockito" }
assertj-core                   = { module = "org.assertj:assertj-core", version.ref = "assertj" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel", version.ref = "micrometerTracing" }
opentelemetry-exporter-otlp    = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
opentelemetry-spring-boot-starter = { module = "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter", version.ref = "opentelemetryInstrumentation" }

[plugins]
spring-boot                    = { id = "org.springframework.boot",                  version.ref = "springBoot" }
spring-dependency-management   = { id = "io.spring.dependency-management",           version.ref = "springDependencyManagement" }
