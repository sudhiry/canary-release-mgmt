server:
  port: 8081

spring:
  application:
    name: payment-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  version: ${VERSION:stable}
  kafka:
    consumers:
      enabled: ${KAFKA_CONSUMERS_ENABLED:true}
  restate:
    register-handlers: ${RESTATE_REGISTER_HANDLERS:true}
    ingress:
      url: ${RESTATE_INGRESS_URL:http://localhost:9070}
    handler:
      port: ${RESTATE_HANDLER_PORT:9081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # Stable pods: only readinessState. Canary pods: overridden via
          # MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE in canary-overlay
          # to also include kafkaConsumer — that gating is what lets stable's
          # pod-watch take over flagged events when canary's consumer dies.
          # Stable does NOT need it (and gating stable on it caused the cold-
          # cluster boot deadlock: lastPollMs==0 → readiness 503 forever).
          include: readinessState
